name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck install.sh
        run: |
          shellcheck install.sh
          shellcheck tests/test_forwarder.sh

      - name: Syntax check
        run: |
          sh -n install.sh
          sh -n tests/test_forwarder.sh

      - name: Run forwarder test suite
        run: sh tests/test_forwarder.sh
