name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck install.sh
        run: |
          shellcheck install.sh
          sh -n install.sh

      - name: Verify partials sync and page rules
        run: |
          cat partials/header.html partials/hero.html partials/omarchy.html partials/matrix.html partials/ecosystem.html partials/install.html partials/studio.html partials/footer.html > /tmp/assembled.html
          cmp -s index.html /tmp/assembled.html
          sh install.sh --help >/dev/null
