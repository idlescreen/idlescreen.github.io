name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck install.sh
        run: |
          shellcheck install.sh
          shellcheck tests/test_forwarder.sh

      - name: Syntax check
        run: |
          sh -n install.sh
          sh -n tests/test_forwarder.sh

      - name: Run forwarder test suite
        run: sh tests/test_forwarder.sh

      - name: Verify page rules and assembly
        run: |
          python3 scripts/assemble.py --check
          python3 tests/test_page_rules.py

      - name: Headless Chrome verification suites
        run: |
          # The three suites below drive the real page in headless Chrome.
          # They were committed but never executed, so regressions in accent
          # handling, the matrix/wordmark layout and section navigation went
          # unnoticed. Run them on every change.
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome not found — the headless suites cannot run"
            exit 1
          fi
          python3 tests/test_accent_verification.py
          python3 tests/test_declutter_verification.py
          python3 tests/test_section_nav.py
