    <script>
      (function(){
        try {
          var k = localStorage.getItem("idlescreen_accent") || "amber";
          var m = {
            coral: ["#ff5555", "255, 85, 85", "#ff9999", "255, 153, 153", [255, 85, 85]],
            orange: ["#ff7700", "255, 119, 0", "#ffa040", "255, 160, 64", [255, 119, 0]],
            amber: ["#ffb000", "255, 176, 0", "#ffd447", "255, 212, 71", [255, 176, 0]],
            yellow: ["#f1fa8c", "241, 250, 140", "#ffffb0", "255, 255, 176", [241, 250, 140]],
            emerald: ["#50fa7b", "80, 250, 123", "#a2ffbc", "162, 255, 188", [80, 250, 123]],
            cyan: ["#00e5ff", "0, 229, 255", "#80f4ff", "128, 244, 255", [0, 229, 255]],
            blue: ["#3b82f6", "59, 130, 246", "#7cb3ff", "124, 179, 255", [59, 130, 246]],
            violet: ["#bd93f9", "189, 147, 249", "#d9b8ff", "217, 184, 255", [189, 147, 249]]
          };
          var c = m[k.toLowerCase()] || m.amber;
          var r = document.documentElement;
          window.idleCurrentAccent = c[4];
          window.idleCurrentAccentName = k;
          r.style.setProperty("--phosphor", c[0]);
          r.style.setProperty("--accent-rgb", c[1]);
          r.style.setProperty("--phosphor-dim", "rgba(" + c[1] + ", 0.12)");
          r.style.setProperty("--phosphor-glow", "rgba(" + c[1] + ", 0.28)");
          r.style.setProperty("--border-accent", "rgba(" + c[1] + ", 0.35)");
          r.style.setProperty("--hot", c[2]);
          r.style.setProperty("--hot-rgb", c[3]);
          r.style.setProperty("--spotlight-border", "rgba(" + c[1] + ", 0.45)");
          r.style.setProperty("--spotlight-glow", "rgba(" + c[3] + ", 0.9)");
          r.style.setProperty("--spotlight-inner", "rgba(" + c[1] + ", 0.035)");
        } catch(e){}
      })();
    </script>
